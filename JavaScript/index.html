<!doctype html>
<html>
    <head>
        <title>javascript</title>
        <link rel="stylesheet" href="main.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
    </head>
    <body>
    <button onclick="change()">menu</button>
     <button onclick="glow()">glow</button>

    <div class="menu">
  Hello World!
</div>

  <div class="gear"></div>

    <script>
    var gear = document.querySelector(".gear");

    function change() {
  console.log('it works!');
  document.querySelector(".menu").classList.toggle("active");
  gear.classList.toggle("spin");
  document.body.classList.toggle("dark");
}

function glow() {
  console.log('glowing');
  gear.classList.toggle("glow");
  document.querySelector(".menu").classList.toggle("glow");
  document.body.classList.toggle("light");
}
   </script>


    </body>
</html>
